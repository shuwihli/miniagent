[project]
name = "langchina"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lll", email = "you@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.32",
    "dotenv>=0.9.9",
    "langchain>=1.4.8",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.7.3",
    "langsmith>=0.14.17",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchina = "langchina:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
